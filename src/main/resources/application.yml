spring:
  application.name: alumex-gallery-server
  datasource:
    # One file, no server, no credentials. Fifteen phones syncing a few times a day is not a
    # workload that needs a database process, and a backup is a file copy.
    #   WAL           readers never block the writer
    #   busy_timeout  a phone waits rather than failing if a write is in flight
    url: ${DB_URL:jdbc:sqlite:file:./data/gallery.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      pool-name: sqlite
  sql.init:
    mode: always                    # schema.sql is idempotent; see the note there
    continue-on-error: false
  servlet.multipart:
    max-file-size: 64MB
    max-request-size: 128MB

server:
  port: ${PORT:8080}
  error.include-message: always

gallery:
  # X.509 SubjectPublicKeyInfo, base64. The matching private key lives on the machine that exports
  # the gallery and never here: a server that cannot sign cannot forge a gallery if it is breached.
  public-key: ${GALLERY_PUBLIC_KEY:}
  admin-token: ${ADMIN_TOKEN:}

logging.level.lk.alumex: INFO
