spring:
  application.name: alumex-gallery-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alumex_gallery}
    username: ${DB_USER:alumex}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
    properties.hibernate.jdbc.lob.non_contextual_creation: true
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 64MB
    max-request-size: 128MB

server:
  port: ${PORT:8080}
  error.include-message: always

gallery:
  # X.509 SubjectPublicKeyInfo, base64. The matching private key lives on the machine that exports
  # the gallery and never here: a server that cannot sign cannot forge a gallery if it is breached.
  public-key: ${GALLERY_PUBLIC_KEY:}
  admin-token: ${ADMIN_TOKEN:}

logging.level.lk.alumex: INFO
